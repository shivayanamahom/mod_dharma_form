MOD_DHARMA_FORM="Dharma Form"
MOD_DHARMA_FORM_DESCRIPTION="<p><strong>Важно:</strong> модуль только рисует форму, а отправку, письма и защиту от спама выполняет плагин <a href='https://github.com/RadicalMart/RadicalForm/releases/latest/download/plg_radicalform.zip' target='_blank' rel='noopener'>RadicalForm</a> (бесплатный). Без него форма ничего не отправит.</p><p>Вкладка «Конструктор форм» — поля формы: текст, e-mail, телефон с маской, текстовая область, список, радиокнопки, чекбоксы, файл, согласие, скрытые поля. Вкладка «Настройки» — простая или модальная форма, кнопка, что показать после отправки, аналитика.</p><p>Одна форма — один модуль, на странице их может быть несколько. Модальное окно открывается кликом по любому элементу с классом, который вы укажете. <a href='../media/mod_dharma_form/readme.html' target='_blank' rel='noopener'><strong>Открыть подробную инструкцию</strong></a></p>"
