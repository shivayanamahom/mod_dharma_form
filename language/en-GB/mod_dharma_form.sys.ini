MOD_DHARMA_FORM="Dharma Form"
MOD_DHARMA_FORM_DESCRIPTION="<p><strong>Important:</strong> this module only renders the form; sending, emails and spam protection are done by the <a href='https://github.com/RadicalMart/RadicalForm/releases/latest/download/plg_radicalform.zip' target='_blank' rel='noopener'>RadicalForm</a> plugin (free). Without it the form sends nothing.</p><p>The Form builder tab holds the fields: text, e-mail, masked phone, textarea, list, radio buttons, checkboxes, file, consent, hidden fields. The Settings tab: simple or modal form, button, what to show after sending, analytics.</p><p>One form is one module; several can be on a page. The popup opens on a click on any element with the class you set. <a href='../media/mod_dharma_form/readme.html' target='_blank' rel='noopener'><strong>Open the full guide</strong></a></p>"
